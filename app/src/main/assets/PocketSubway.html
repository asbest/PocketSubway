<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pocket Subway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            display: block;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }

        .ui-element {
            pointer-events: auto;
        }

        /* Styles for toggle switch */
        .toggle-label:after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 9999px;
            background-color: white;
            transition: 0.2s;
        }
        input:checked + .toggle-label {
            background-color: #4ade80; /* green-400 */
        }
        input:checked + .toggle-label:after {
            transform: translateX(calc(100% - 2px));
        }

    </style>
</head>

<body>
    <div id="ui-container" class="flex flex-col items-center justify-center">
        <div id="loading-screen" class="absolute inset-0 bg-black flex flex-col items-center justify-center z-50">
            <div class="text-2xl" data-testid="loading-text">Loading...</div>
        </div>

        <div id="pause-menu" class="hidden absolute inset-0 bg-black bg-opacity-75 flex-col items-center justify-center gap-4 z-40">
            <div class="text-4xl font-bold mb-8">Paused</div>
            <button id="resume-button" class="ui-element text-2xl px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">Resume</button>
            <div class="flex items-center gap-4">
                <label for="headlight-toggle" class="text-xl">Scheinwerfer</label>
                <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="headlight-toggle" id="headlight-toggle" class="sr-only" checked/>
                    <label for="headlight-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                </div>
            </div>
             <div class="flex items-center gap-4">
                <label for="sound-toggle" class="text-xl">Sound</label>
                <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="sound-toggle" id="sound-toggle" class="sr-only" checked/>
                    <label for="sound-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                </div>
            </div>
            <button id="save-button" class="ui-element text-2xl px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">Save Game</button>
            <button id="load-button" class="ui-element text-2xl px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">Load Game</button>
        </div>

        <div id="in-game-ui" class="absolute bottom-4 right-4 flex flex-col gap-2 text-lg text-right">
            <div id="speed-display">Speed: 0 km/h</div>
            <div id="score-display">Score: 0</div>
            <div id="schedule-display" class="text-yellow-400"></div>
            <div id="station-info" class="text-cyan-400"></div>
            <div id="signal-info" class="text-red-500"></div>
        </div>

        <button id="pause-button" class="ui-element absolute top-4 right-4 px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">Pause</button>
         <button id="door-button" class="ui-element absolute bottom-4 left-4 px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">Doors</button>

    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.148.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.148.0/examples/jsm/",
            "tone": "https://unpkg.com/tone@14.7.77/build/Tone.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import SimplexNoise from 'https://cdn.skypack.dev/simplex-noise@3.0.0';
        import * as Tone from 'tone';

        // --- Basic Setup ---
        let scene, camera, renderer, composer, headlight;
        let clock = new THREE.Clock();
        let isPaused = false;
        const simplex = new SimplexNoise();
        let audioReady = false;

        // --- Game State ---
        window.playerSpeed = 0;
        window.throttle = 0;
        window.brake = 0;
        window.score = 0;
        window.playerDistance = 0;
        let totalTrackLength = 0;
        let trackGroup = new THREE.Group();
        let trackCurve;
        let stations = [];
        let signals = [];
        let switchInfo = null;
        let branchCurve = null;

        // --- Constants ---
        const NUM_SEGMENTS = 50;
        const ACCELERATION = 0.5;
        const BRAKE_FORCE = 1.5;
        const FRICTION = 0.1;
        const MAX_SPEED = 100;

        // --- Function Calls ---
        init();
        
        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 1, 800);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.21;
            bloomPass.strength = 1.2;
            bloomPass.radius = 0.55;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            scene.add(new THREE.AmbientLight(0x404040, 0.2));
            setupHeadlight();
            
            loadGame(null, true);
        }

        function loadGame(savedState = null, isInitialLoad = false) {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.display = 'flex';
            
            setTimeout(() => {
                if (scene.children.includes(trackGroup)) {
                    // Dispose and remove old track
                     while(trackGroup.children.length > 0){
                        const object = trackGroup.children[0];
                        if(object.geometry) object.geometry.dispose();
                        if(object.material) {
                            if(Array.isArray(object.material)) object.material.forEach(m=>m.dispose())
                            else object.material.dispose();
                        }
                        if(object.dispose) object.dispose(); // For instanced meshes
                        trackGroup.remove(object);
                    }
                    scene.remove(trackGroup);
                }
                trackGroup = new THREE.Group();
                scene.add(trackGroup);
                stations = [];
                signals = [];
                switchInfo = null;
                branchCurve = null;

                if (savedState) {
                    window.playerDistance = savedState.playerDistance;
                    window.playerSpeed = savedState.playerSpeed;
                    window.throttle = savedState.throttle;
                    window.brake = savedState.brake;
                    window.score = savedState.score;
                    const points = savedState.trackPoints.map(p => new THREE.Vector3(p.x, p.y, p.z));
                    trackCurve = new THREE.CatmullRomCurve3(points, true);
                } else {
                    window.playerDistance = 0;
                    window.playerSpeed = 0;
                    window.throttle = 0;
                    window.brake = 0;
                    window.score = 0;
                    trackCurve = createTrackCurve(NUM_SEGMENTS);
                }
                
                totalTrackLength = trackCurve.getLength();
                
                const { tunnel, ties } = createTrackGeometry(trackCurve, totalTrackLength);
                trackGroup.add(tunnel);
                trackGroup.add(ties);
                
                createStations();
                createSignals();
                
                updatePlayerPosition();
                
                loadingScreen.style.display = 'none';

                if (isInitialLoad) {
                    setupControls();
                    initAudio();
                    animate();
                }

            }, 50);
        }

        function createTrackCurve(numSegments) {
            const points = [];
            let pos = new THREE.Vector3(0, 0, 0);
            let dir = new THREE.Vector3(0, 0, -1);
            for (let i = 0; i < numSegments; i++) {
                points.push(pos.clone());
                const turn = (Math.random() - 0.5) * 0.4;
                const pitch = (Math.random() - 0.5) * 0.1;
                const quaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), turn);
                dir.applyQuaternion(quaternion);
                const pitchQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
                dir.applyQuaternion(pitchQuat);
                dir.normalize();
                pos.add(dir.clone().multiplyScalar(200));
            }
            return new THREE.CatmullRomCurve3(points, true, 'catmullrom', 0.5);
        }
        
        function createTrackGeometry(curve, length) {
            // A placeholder geometry
            const material = new THREE.MeshStandardMaterial({ color: 0x555555, side: THREE.BackSide });
            const geometry = new THREE.TubeGeometry(curve, Math.floor(length / 10), 10, 8, false);
            const tunnel = new THREE.Mesh(geometry, material);
            return { tunnel, ties: new THREE.Group() };
        }

        function createStations() { /* Placeholder */ }
        function createSignals() { /* Placeholder */ }

        function setupHeadlight() {
            headlight = new THREE.SpotLight(0xffffff, 1.5, 1000, Math.PI / 4, 0.5, 2);
            headlight.castShadow = true;
            headlight.shadow.mapSize.width = 1024;
            headlight.shadow.mapSize.height = 1024;
            headlight.shadow.camera.near = 0.5;
            headlight.shadow.camera.far = 1000;
            camera.add(headlight);
            headlight.position.set(0, 0, 1);
            headlight.target = camera;
        }

        function initAudio() {
             document.body.addEventListener('click', async () => {
                if (audioReady) return;
                await Tone.start();
                console.log('Audio is ready');
                audioReady = true;
                // Start transport for any time-based audio events
                Tone.Transport.start();
            }, { once: true });
        }

        function animate() {
            if (isPaused) {
                requestAnimationFrame(animate);
                return;
            }

            const delta = clock.getDelta();
            requestAnimationFrame(animate);

            updatePhysics(delta);
            updatePlayerPosition();
            checkStationStatus();
            checkSignalStatus();
            updateUI();

            composer.render();
        }

        function updatePhysics(delta) {
            window.playerSpeed += window.throttle * ACCELERATION * delta;
            let brakeEffect = window.brake * BRAKE_FORCE * delta;
            window.playerSpeed = Math.sign(window.playerSpeed) * Math.max(0, Math.abs(window.playerSpeed) - brakeEffect);
            let frictionEffect = FRICTION * delta;
            window.playerSpeed = Math.sign(window.playerSpeed) * Math.max(0, Math.abs(window.playerSpeed) - frictionEffect);
            window.playerSpeed = Math.max(-MAX_SPEED / 3.6, Math.min(MAX_SPEED / 3.6, window.playerSpeed));
            window.playerDistance += window.playerSpeed * delta;
            if (window.playerDistance > totalTrackLength) window.playerDistance -= totalTrackLength;
            if (window.playerDistance < 0) window.playerDistance += totalTrackLength;
        }
        
        function updatePlayerPosition() {
            const progress = window.playerDistance / totalTrackLength;
            const pos = trackCurve.getPointAt(progress);
            const tangent = trackCurve.getTangentAt(progress);
            camera.position.copy(pos);
            camera.position.y += 1.5;
            const lookAtPos = pos.clone().add(tangent);
            camera.lookAt(lookAtPos);
        }

        function checkStationStatus() { /* Placeholder */ }
        function checkSignalStatus() { /* Placeholder */ }

        function updateUI() {
            document.getElementById('speed-display').textContent = `Speed: ${Math.round(Math.abs(window.playerSpeed * 3.6))} km/h`;
            document.getElementById('score-display').textContent = `Score: ${window.score}`;
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if(isPaused) return;
                if (e.key === 'w' || e.key === 'W') window.throttle = 1;
                if (e.key === 's' || e.key === 'S') window.brake = 1;
            });

             document.addEventListener('keyup', (e) => {
                if (e.key === 'w' || e.key === 'W') window.throttle = 0;
                if (e.key === 's' || e.key === 'S') window.brake = 0;
            });

            document.getElementById('pause-button').addEventListener('click', () => togglePause());
            document.getElementById('resume-button').addEventListener('click', () => togglePause());
            
            document.getElementById('save-button').addEventListener('click', saveGame);
            document.getElementById('load-button').addEventListener('click', () => {
                const savedGame = localStorage.getItem('pocketSubwaySave');
                if (savedGame) {
                    if(isPaused) togglePause(false);
                    loadGame(JSON.parse(savedGame));
                } else {
                    alert('No saved game found!');
                }
            });

            const soundToggle = document.getElementById('sound-toggle');
            soundToggle.addEventListener('change', () => {
                Tone.Destination.mute = !soundToggle.checked;
            });
        }
        
        function togglePause(forceState = null) {
            isPaused = forceState !== null ? forceState : !isPaused;
            document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
        }

        function saveGame() {
            const gameState = {
                playerDistance: window.playerDistance,
                playerSpeed: window.playerSpeed,
                throttle: window.throttle,
                brake: window.brake,
                score: window.score,
                trackPoints: trackCurve.points.map(p => ({ x: p.x, y: p.y, z: p.z })),
            };
            localStorage.setItem('pocketSubwaySave', JSON.stringify(gameState));
            const saveButton = document.getElementById('save-button');
            saveButton.textContent = 'Saved!';
            setTimeout(() => { saveButton.textContent = 'Save Game'; }, 2000);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }, false);
    </script>
</body>

</html>
