<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prozeduraler U-Bahn Simulator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.skypack.dev/three@0.138.0"
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* Vertikale Slider für Steuerung */
        input[type=range][orient=vertical] {
            writing-mode: bt-lr; /* IE */
            -webkit-appearance: slider-vertical; /* WebKit */
            appearance: slider-vertical;
            width: 2rem;
            height: 150px;
            padding: 0 5px;
        }
    </style>
</head>
<body class="text-white">

    <!-- 3D-Canvas-Container -->
    <div id="canvas-container"></div>

    <!-- Ladebildschirm -->
    <div id="loading-screen" class="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500 mx-auto"></div>
            <p class="text-xl mt-4">Generiere Strecke...</p>
            <p class="text-sm text-gray-400">Das kann einen Moment dauern.</p>
        </div>
    </div>

    <!-- UI-Overlay -->
    <div id="ui-container" class="fixed inset-0 pointer-events-none p-4 md:p-8 flex flex-col justify-between hidden">
        
        <!-- Obere Info-Anzeige -->
        <div class="w-full flex justify-between items-start text-lg">
            <!-- Status-Anzeige -->
            <div class="bg-black bg-opacity-50 p-3 rounded-lg shadow-lg">
                <h2 class="text-sm font-semibold text-gray-400">NÄCHSTE HALTESTELLE</h2>
                <p id="next-station-name" class="text-2xl font-bold">Hauptbahnhof</p>
                <p id="next-station-distance" class="text-xl font-mono">1500 m</p>
            </div>
            
            <!-- Geschwindigkeitsanzeige -->
            <div class="bg-black bg-opacity-50 p-3 rounded-lg shadow-lg text-right">
                <h2 class="text-sm font-semibold text-gray-400">GESCHWINDIGKEIT</h2>
                <p id="speed-display" class="text-4xl font-bold font-mono">0</p>
                <p class="text-lg text-gray-300">km/h</p>
            </div>
        </div>

        <!-- Untere Steuerung -->
        <div class="w-full flex justify-between items-end pointer-events-auto">
            
            <!-- Linke Steuerung (Schub & Bremse) -->
            <div class="flex space-x-8 bg-black bg-opacity-50 p-4 rounded-lg shadow-lg">
                <!-- Schub -->
                <div class="flex flex-col items-center">
                    <label for="throttle" class="text-sm font-semibold text-green-400">SCHUB</label>
                    <input type="range" id="throttle" orient="vertical" min="0" max="100" value="0" class="mt-2 h-36 md:h-48 accent-green-500">
                    <span id="throttle-value" class="font-mono text-lg mt-2">0%</span>
                </div>
                <!-- Bremse -->
                <div class="flex flex-col items-center">
                    <label for="brake" class="text-sm font-semibold text-red-400">BREMSE</label>
                    <input type="range" id="brake" orient="vertical" min="0" max="100" value="0" class="mt-2 h-36 md:h-48 accent-red-500">
                    <span id="brake-value" class="font-mono text-lg mt-2">0%</span>
                </div>
            </div>

            <!-- Rechte Steuerung (Türen & Status) -->
            <div class="flex flex-col items-end space-y-4">
                <!-- Statusmeldung -->
                <div id="status-message" class="bg-blue-600 bg-opacity-80 p-3 rounded-lg shadow-lg text-lg font-semibold text-center hidden">
                    An Haltestelle angehalten.
                </div>

                <!-- Türsteuerung -->
                <button id="door-button" classs="w-full" disabled>
                    <div class="bg-gray-700 p-4 rounded-lg shadow-lg text-xl font-bold transition-all duration-200 cursor-not-allowed opacity-50 flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4" />
                        </svg>
                        <span id="door-status-text">TÜREN GESCHLOSSEN</span>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- Globale Variablen ---
        let scene, camera, renderer, clock;
        let driverCab; // Gruppe für das Cockpit
        let trackCurve; // Die Hauptkurve der Strecke
        let totalTrackLength = 0;
        let playerDistance = 0; // Distanz des Spielers auf der Strecke
        let playerSpeed = 0; // in m/s

        // Steuerungs- und Physikvariablen
        let throttle = 0; // 0-1
        let brake = 0; // 0-1
        let doorsOpen = false;
        let atStation = false;
        let currentStation = null;

        const MASS = 50000; // Masse der U-Bahn in kg
        const MAX_THROTTLE_FORCE = 80000; // Newton
        const MAX_BRAKE_FORCE = 200000; // Newton
        const FRICTION_COEFFICIENT = 150; // Rollwiderstand
        const GRAVITY = 9.81;
        const MAX_SPEED = 25; // m/s (ca. 90 km/h)

        // Strecken-Generierung
        const stations = [];
        const NUM_SEGMENTS = 50; // Anzahl der Streckenabschnitte
        const MIN_SEGMENT_LENGTH = 300; // Meter
        const MAX_SEGMENT_LENGTH = 1000; // Meter
        const STATION_LENGTH = 200; // Meter
        const MAX_CURVATURE = 0.001; // Bogenmaß pro Meter
        const MAX_INCLINE = 0.0005; // Höhenänderung pro Meter

        // DOM-Elemente
        const ui = {
            loadingScreen: document.getElementById('loading-screen'),
            uiContainer: document.getElementById('ui-container'),
            speedDisplay: document.getElementById('speed-display'),
            nextStationName: document.getElementById('next-station-name'),
            nextStationDistance: document.getElementById('next-station-distance'),
            throttleSlider: document.getElementById('throttle'),
            throttleValue: document.getElementById('throttle-value'),
            brakeSlider: document.getElementById('brake'),
            brakeValue: document.getElementById('brake-value'),
            doorButton: document.getElementById('door-button'),
            doorStatusText: document.getElementById('door-status-text'),
            statusMessage: document.getElementById('status-message'),
        };

        // --- Initialisierung ---
        function init() {
            // Szene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202020);
            scene.fog = new THREE.Fog(0x202020, 50, 400);

            // Uhr
            clock = new THREE.Clock();

            // Kamera (First-Person)
            camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.0, 0); 
            
            // Renderer
            const container = document.getElementById('canvas-container');
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Cockpit erstellen
            createDriverCab();
            camera.add(driverCab); // Cockpit an Kamera heften
            scene.add(camera);
            
            // Event-Listener
            window.addEventListener('resize', onWindowResize);
            setupControls();

            // Asynchrones Generieren der Strecke
            setTimeout(() => {
                buildProceduralTrack();
                ui.loadingScreen.style.display = 'none';
                ui.uiContainer.classList.remove('hidden');
                animate();
            }, 50);
        }

        // --- Strecken-Generierung ---
        function buildProceduralTrack() {
            const points = [];
            let currentPos = new THREE.Vector3(0, 0, 0);
            let currentDir = new THREE.Vector3(0, 0, -1); // Startrichtung Z-
            
            let currentCurvature = 0;
            let currentIncline = 0;
            totalTrackLength = 0;

            const up = new THREE.Vector3(0, 1, 0);
            const tempVec = new THREE.Vector3();
            const tempQuat = new THREE.Quaternion();

            let lastWasStation = false;

            for (let i = 0; i < NUM_SEGMENTS; i++) {
                const isStation = Math.random() < 0.2 && !lastWasStation && i > 0;
                let segmentLength;
                let targetCurvature;
                let targetIncline;

                if (isStation) {
                    segmentLength = STATION_LENGTH;
                    targetCurvature = 0; // Bahnhöfe sind gerade
                    targetIncline = 0;   // Bahnhöfe sind flach
                    stations.push({
                        name: `Haltestelle ${String.fromCharCode(65 + stations.length)}`,
                        distance: totalTrackLength + segmentLength / 2,
                        length: segmentLength
                    });
                    lastWasStation = true;
                } else {
                    segmentLength = MIN_SEGMENT_LENGTH + Math.random() * (MAX_SEGMENT_LENGTH - MIN_SEGMENT_LENGTH);
                    targetCurvature = (Math.random() - 0.5) * 2 * MAX_CURVATURE;
                    targetIncline = (Math.random() - 0.5) * 2 * MAX_INCLINE;
                    lastWasStation = false;
                }

                // Punkte für dieses Segment generieren (1 Punkt pro Meter)
                for (let m = 0; m < segmentLength; m++) {
                    // Sanfter Übergang zu neuer Krümmung/Steigung
                    currentCurvature += (targetCurvature - currentCurvature) * 0.05;
                    currentIncline += (targetIncline - currentIncline) * 0.05;

                    // Drehung für Kurve (um Y-Achse)
                    tempQuat.setFromAxisAngle(up, currentCurvature);
                    currentDir.applyQuaternion(tempQuat);

                    // Drehung für Steigung (um lokale X-Achse)
                    tempVec.crossVectors(currentDir, up).normalize(); // Lokale X-Achse (rechts)
                    tempQuat.setFromAxisAngle(tempVec, currentIncline);
                    currentDir.applyQuaternion(tempQuat);
                    
                    currentPos.add(currentDir);
                    points.push(currentPos.clone());
                    totalTrackLength++;
                }
            }

            trackCurve = new THREE.CatmullRomCurve3(points);
            trackCurve.curveType = 'catmullrom';
            trackCurve.tension = 0.5;

            // Geometrie für die Strecke erstellen
            createTrackGeometry(trackCurve, points.length);
            
            // Bahnhöfe erstellen
            createStations(trackCurve);
        }

        // --- Strecken-Geometrie ---
        function createTrackGeometry(curve, numPoints) {
            
            // 1. Der Tunnel
            const tunnelGeometry = new THREE.TubeGeometry(curve, numPoints, 5, 8, false);
            const tunnelMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x8B4513, // Hellbraun (SaddleBrown)
                side: THREE.BackSide, 
            });
            const tunnelMesh = new THREE.Mesh(tunnelGeometry, tunnelMaterial);
            scene.add(tunnelMesh);

            // 2. Schienen
            const railPointsLeft = [];
            const railPointsRight = [];
            const railOffset = 1.0; 
            const railHeight = -4.5; 
            
            const up = new THREE.Vector3(0, 1, 0);
            const binormal = new THREE.Vector3();
            const tangent = new THREE.Vector3();
            const pos = new THREE.Vector3();

            for (let i = 0; i < numPoints; i++) {
                const t = i / numPoints;
                curve.getPointAt(t, pos);
                curve.getTangentAt(t, tangent);
                
                binormal.crossVectors(up, tangent).normalize(); 
                
                const posLeft = pos.clone().add(binormal.clone().multiplyScalar(railOffset)).add(up.clone().multiplyScalar(railHeight));
                const posRight = pos.clone().add(binormal.clone().multiplyScalar(-railOffset)).add(up.clone().multiplyScalar(railHeight));
                
                railPointsLeft.push(posLeft);
                railPointsRight.push(posRight);
            }

            const railCurveLeft = new THREE.CatmullRomCurve3(railPointsLeft);
            const railCurveRight = new THREE.CatmullRomCurve3(railPointsRight);

            const railGeo = new THREE.TubeGeometry(railCurveLeft, numPoints, 0.1, 4, false);
            const railMat = new THREE.MeshBasicMaterial({ color: 0x888888 }); 
            const railMeshLeft = new THREE.Mesh(railGeo, railMat);
            const railMeshRight = new THREE.Mesh(railGeo.clone().copy(new THREE.TubeGeometry(railCurveRight, numPoints, 0.1, 4, false)), railMat);
            
            scene.add(railMeshLeft);
            scene.add(railMeshRight);

            // 3. Schwellen
            const tieGeo = new THREE.BoxGeometry(2.5, 0.15, 0.3);
            const tieMat = new THREE.MeshBasicMaterial({ color: 0x4a2a0a }); 
            const tieCount = Math.floor(totalTrackLength / 1.5); 
            const tieMesh = new THREE.InstancedMesh(tieGeo, tieMat, tieCount);
            
            const dummy = new THREE.Object3D();
            const lookAtPos = new THREE.Vector3();

            for (let i = 0; i < tieCount; i++) {
                const t = (i / tieCount);
                const t_next = (i + 1) / tieCount;
                
                curve.getPointAt(t, dummy.position);
                curve.getPointAt(t_next, lookAtPos);
                
                dummy.position.y += railHeight - 0.1; 
                dummy.lookAt(lookAtPos);
                
                dummy.updateMatrix();
                tieMesh.setMatrixAt(i, dummy.matrix);
            }
            tieMesh.instanceMatrix.needsUpdate = true;
            scene.add(tieMesh);
        }

        // --- Bahnhöfe ---
        function createStations(curve) {
            const platformGeo = new THREE.BoxGeometry(STATION_LENGTH, 1, 4);
            const platformMat = new THREE.MeshBasicMaterial({ color: 0xbbbbbb }); 
            const platformHeight = -3.5;
            const platformOffset = 4; 

            const up = new THREE.Vector3(0, 1, 0);
            const binormal = new THREE.Vector3();
            const tangent = new THREE.Vector3();
            const pos = new THREE.Vector3();
            
            stations.forEach(station => {
                const t = station.distance / totalTrackLength;
                curve.getPointAt(t, pos);
                curve.getTangentAt(t, tangent);
                binormal.crossVectors(up, tangent).normalize();
                
                // Plattform links
                const platformLeft = new THREE.Mesh(platformGeo, platformMat);
                const posLeft = pos.clone().add(binormal.clone().multiplyScalar(platformOffset)).add(up.clone().multiplyScalar(platformHeight));
                platformLeft.position.copy(posLeft);
                platformLeft.lookAt(pos.clone().add(tangent).add(binormal.clone().multiplyScalar(platformOffset)));
                scene.add(platformLeft);
                
                // Plattform rechts
                const platformRight = new THREE.Mesh(platformGeo, platformMat);
                const posRight = pos.clone().add(binormal.clone().multiplyScalar(-platformOffset)).add(up.clone().multiplyScalar(platformHeight));
                platformRight.position.copy(posRight);
                platformRight.lookAt(pos.clone().add(tangent).add(binormal.clone().multiplyScalar(-platformOffset)));
                scene.add(platformRight);
            });
        }
        
        // --- Cockpit Erstellung ---
        function createDriverCab() {
            driverCab = new THREE.Group();
            
            const cabMat = new THREE.MeshBasicMaterial({ 
                color: 0x333333, 
                side: THREE.DoubleSide, 
            });
            
            // KORREKTUR: Cockpit auf das absolute Minimum reduziert
            // Nur noch ein kleines, niedriges Armaturenbrett
            
            // Geometrie: 4 breit, 0.2 hoch, 0.1 tief
            const dashGeo = new THREE.BoxGeometry(4, 0.2, 0.1);
            const dash = new THREE.Mesh(dashGeo, cabMat);
            
            // Position: Niedrig (y=-0.8) und vor der Kamera (z=-2.5)
            // Top edge will be at y = -0.7 relative to camera center
            dash.position.set(0, -0.8, -2.5); 
            driverCab.add(dash);

            // Alle anderen Teile (Boden, Dach, Wände, Fenster) wurden entfernt
        }

        // --- Steuerung ---
        function setupControls() {
            ui.throttleSlider.addEventListener('input', (e) => {
                throttle = parseInt(e.target.value) / 100;
                ui.throttleValue.innerText = `${e.target.value}%`;
                if (throttle > 0) {
                    brake = 0;
                    ui.brakeSlider.value = 0;
                    ui.brakeValue.innerText = '0%';
                }
            });
            
            ui.brakeSlider.addEventListener('input', (e) => {
                brake = parseInt(e.target.value) / 100;
                ui.brakeValue.innerText = `${e.target.value}%`;
                if (brake > 0) {
                    throttle = 0;
                    ui.throttleSlider.value = 0;
                    ui.throttleValue.innerText = '0%';
                }
            });

            ui.throttleSlider.addEventListener('mouseup', () => {
                ui.throttleSlider.value = 0;
                throttle = 0;
                ui.throttleValue.innerText = '0%';
            });
            
            ui.doorButton.addEventListener('click', () => {
                if (atStation && playerSpeed < 0.1) {
                    doorsOpen = !doorsOpen;
                    updateDoorButton();
                }
            });
        }
        
        // --- Game Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            updatePhysics(dt);
            updateCameraPosition();
            checkStationStatus();
            updateUI();

            renderer.render(scene, camera);
        }

        // --- Physik-Update ---
        function updatePhysics(dt) {
            if (!trackCurve) return;

            // 1. Kräfte berechnen
            const t = playerDistance / totalTrackLength;
            const tangent = trackCurve.getTangentAt(t);
            const incline = tangent.y; 

            const gravityForce = GRAVITY * incline * MASS;
            let throttleForce = throttle * MAX_THROTTLE_FORCE;
            let brakeForce = brake * MAX_BRAKE_FORCE;
            const frictionForce = playerSpeed * FRICTION_COEFFICIENT + playerSpeed * playerSpeed * 10; 

            if (doorsOpen) {
                throttleForce = 0;
                brakeForce = MAX_BRAKE_FORCE * 1.5; 
                throttle = 0;
                ui.throttleSlider.value = 0;
            }

            const totalForce = throttleForce - brakeForce - frictionForce - gravityForce;
            const acceleration = totalForce / MASS;
            
            // 2. Geschwindigkeit und Distanz aktualisieren
            playerSpeed += acceleration * dt;

            if (playerSpeed < 0) playerSpeed = 0;
            if (playerSpeed > MAX_SPEED) playerSpeed = MAX_SPEED;
            
            playerDistance += playerSpeed * dt;

            if (playerDistance > totalTrackLength) {
                playerDistance -= totalTrackLength;
            }
            if (playerDistance < 0) {
                playerDistance += totalTrackLength;
            }
        }

        // --- Kamera-Update ---
        function updateCameraPosition() {
            if (!trackCurve) return;

            const t = playerDistance / totalTrackLength;
            const t_lookat = (playerDistance + 15) / totalTrackLength; 

            const camPos = trackCurve.getPointAt(t);
            const camLookAt = trackCurve.getPointAt(t_lookat);
            
            const wobbleX = Math.sin(Date.now() * 0.005 * playerSpeed) * 0.01;
            const wobbleY = Math.cos(Date.now() * 0.004 * playerSpeed) * 0.01;

            camera.position.copy(camPos).add(new THREE.Vector3(wobbleX, 1.0 + wobbleY, 0));
            
            camLookAt.y -= 0.5; 
            
            const tangent = trackCurve.getTangentAt(t);
            const up = new THREE.Vector3(0, 1, 0);
            const binormal = new THREE.Vector3().crossVectors(up, tangent).normalize();
            const normal = new THREE.Vector3().crossVectors(tangent, binormal).normalize();
            camera.up.copy(normal);

            camera.lookAt(camLookAt);
        }

        // --- Stations-Logik ---
        function checkStationStatus() {
            let wasAtStation = atStation;
            atStation = false;
            currentStation = null;
            let minDistanceToStop = Infinity;
            
            let nextStation = null;
            let minDistanceToNext = Infinity;

            for (const station of stations) {
                const distToStationCenter = station.distance - playerDistance;
                const absDist = Math.abs(distToStationCenter);
                
                if (absDist < station.length / 2) {
                    atStation = true;
                    currentStation = station;
                    minDistanceToStop = distToStationCenter;
                    break; 
                }
                
                let distToNext = distToStationCenter;
                if (distToNext < 0) {
                    distToNext += totalTrackLength;
                }
                
                if (distToNext < minDistanceToNext) {
                    minDistanceToNext = distToNext;
                    nextStation = station;
                }
            }
            
            if (atStation) {
                ui.nextStationName.innerText = currentStation.name;
                ui.nextStationDistance.innerText = `STOP ${minDistanceToStop.toFixed(0)} m`;
                
                if (playerSpeed < 0.1) {
                    if (!wasAtStation) { 
                        ui.statusMessage.innerText = `Haltestelle: ${currentStation.name}`;
                        ui.statusMessage.classList.remove('hidden');
                    }
                } else {
                    ui.statusMessage.classList.add('hidden');
                }

            } else {
                ui.statusMessage.classList.add('hidden');
                if (nextStation) {
                    ui.nextStationName.innerText = nextStation.name;
                    ui.nextStationDistance.innerText = `${minDistanceToNext.toFixed(0)} m`;
                }
            }

            updateDoorButton();
        }
        
        // --- UI-Updates ---
        function updateUI() {
            ui.speedDisplay.innerText = (playerSpeed * 3.6).toFixed(0);
        }
        
        function updateDoorButton() {
            const canOpen = atStation && playerSpeed < 0.1;
            const buttonDiv = ui.doorButton.children[0];
            
            if (doorsOpen) {
                ui.doorStatusText.innerText = 'TÜREN SCHLIESSEN';
                buttonDiv.classList.remove('bg-gray-700', 'opacity-50', 'cursor-not-allowed', 'bg-green-600');
                buttonDiv.classList.add('bg-yellow-500');
                ui.doorButton.disabled = false;
            } else {
                ui.doorStatusText.innerText = 'TÜREN ÖFFNEN';
                if (canOpen) {
                    buttonDiv.classList.remove('bg-gray-700', 'opacity-50', 'cursor-not-allowed', 'bg-yellow-500');
                    buttonDiv.classList.add('bg-green-600');
                    ui.doorButton.disabled = false;
                } else {
                    buttonDiv.classList.remove('bg-green-600', 'bg-yellow-500');
                    buttonDiv.classList.add('bg-gray-700', 'opacity-50', 'cursor-not-allowed');
                    ui.doorButton.disabled = true;
                }
            }
        }

        // --- Fenster-Resize ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Start ---
        init();

    </script>
</body>
</html>
